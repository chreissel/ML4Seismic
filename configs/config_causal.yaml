seed_everything: 42

trainer:
  # Device configuration
  accelerator: auto 
  
  # Output directory for logs and checkpoints
  default_root_dir: 'runs/causal/'
  
  # Training configuration
  max_epochs: 80
  log_every_n_steps: 10
  
  # Gradient clipping (helps with training stability)
  gradient_clip_val: 1.0
  

  callbacks:
    # Save best models based on validation loss
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 3  
        save_last: true  # Also save the last checkpoint
        filename: 'epoch{epoch:02d}-val_loss{val/loss:.4f}'
        auto_insert_metric_name: false
    
    
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 10  
        mode: min
        min_delta: 0.0001 
    
    # Learning rate monitor
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
  
  # Logger configuration
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: gs13-prediction
      name: s4d-causal
      save_dir: runs/

# ============================================================================
# Data Configuration
# ============================================================================
data:
  class_path: data.GS13DataModule
  init_args:
    time: 1381528818
    seq_length: 240  # 60 seconds at 4 Hz
    predict_horizon: 4  # Predict 1 second (4 timesteps) ahead
    
    normalize: true  
    
    batch_size: 32
    num_workers: 4
    pin_memory: true  
    data_dir: data 

# ============================================================================
# Model Configuration
# ============================================================================
model:
  class_path: model.LitModel
  init_args:
    d_input: &d_input 10  # 10 input channels
    d_output: &d_output 1  # 1 output (GS13.X)
    loss: MSELoss
    
    # S4D Encoder
    encoder:
      class_path: models.networks.S4DModel
      init_args: 
        d_input: *d_input
        d_output: *d_output
        d_model: 64  # Model dimension
        n_layers: 8  # Number of S4D layers
        dropout: 0.0  # Dropout rate (S4D handles regularization differently)
        prenorm: False  # Pre-normalization
        maxpool: False  # Use last timestep instead of max pooling

# ============================================================================
# Optimizer Configuration
# ============================================================================
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-3  
    weight_decay: 1e-5  


lr_scheduler:
  class_path: torch.optim.lr_scheduler.ReduceLROnPlateau
  init_args:
    mode: min
    factor: 0.5 
    patience: 8  
    min_lr: 1e-6  

  monitor: val/loss
  interval: epoch
  frequency: 1

