trainer:
  accelerator: auto  
  default_root_dir: 'runs/lstm/'
  max_epochs: 200
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 3  
        save_last: true  
        filename: 'epoch{epoch:02d}-val_loss{val/loss:.4f}'
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 15  
        mode: min
        min_delta: 0.0001  
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: lstm-15-to-6-forecast 
      save_dir: runs/

data:
  class_path: data.LitDataModule
  init_args:
    mat_file: 'MLdata_L1HAM5_1381528818_4000_matrix_v2.mat'
    predict_horizon: &predict_horizon 4 
    normalize: True 
    batch_size: 32
    num_workers: 1
    train_channels: ['L1:ISI-HAM5_BLND_GS13X_IN1_DQ']
    target_channels: ['L1:ISI-HAM5_BLND_GS13X_IN1_DQ']


model:
  class_path: model.LSTMForecast
  init_args:
    input_size: 1  
    hidden_size: 128  
    predict_horizon: *predict_horizon
    num_layers: 3  
    dropout: 0.2  
    output_size: 1  
    learning_rate: 1e-3  

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-3  # Initial learning rate
    weight_decay: 1e-4  # L2 regularization (set to 0 to disable)
    betas: [0.9, 0.999]  # Adam beta parameters

lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    monitor: val/loss
    mode: min
    factor: 0.5  
    patience: 15  
    min_lr: 1e-6  
